<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF4D00"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="5" fill="#0A0A0F"/>
  <circle cx="16" cy="16" r="13" fill="none" stroke="url(#grad)" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="16" cy="3" r="1.5" fill="#FF4D00" filter="url(#glow)"/>
  <circle cx="29" cy="16" r="1.5" fill="#6C63FF" filter="url(#glow)"/>
  <circle cx="16" cy="29" r="1.5" fill="#FF8A00" filter="url(#glow)"/>
  <circle cx="3" cy="16" r="1.5" fill="#6C63FF" filter="url(#glow)"/>
  <text x="16" y="16" font-family="Orbitron, Arial Black, sans-serif" font-weight="900" font-size="11"
    fill="url(#grad)" text-anchor="middle" dominant-baseline="central" filter="url(#glow)">AI</text>
</svg>
