<title>AI Academy — Confirmación de Pago</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0A0A0F;
    --accent: #FF4D00;
    --text: #FFFFFF;
    --text2: #A0A0B0;
    --card: #14141F;
    --border: #2A2A3F;
    --green: #00C853;
    --yellow: #FFD600;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    background: radial-gradient(ellipse at 20% 50%, rgba(255,77,0,0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(108,99,255,0.04) 0%, transparent 60%);
  }

  .card {
    position: relative;
    z-index: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 56px 48px;
    max-width: 540px;
    width: 100%;
    text-align: center;
    box-shadow: 0 0 80px rgba(255,77,0,0.08);
  }

  .icon {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 28px;
    font-size: 2.4rem;
  }

  .icon-success { background: rgba(0,200,83,0.15); border: 2px solid rgba(0,200,83,0.4); }
  .icon-failure { background: rgba(255,77,0,0.15); border: 2px solid rgba(255,77,0,0.4); }
  .icon-pending { background: rgba(255,214,0,0.15); border: 2px solid rgba(255,214,0,0.4); }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    margin-bottom: 16px;
    line-height: 1.2;
  }

  .success-title { color: var(--green); }
  .failure-title { color: var(--accent); }
  .pending-title { color: var(--yellow); }

  p {
    color: var(--text2);
    font-size: 1.05rem;
    line-height: 1.7;
    margin-bottom: 12px;
  }

  .highlight {
    color: var(--text);
    font-weight: 600;
  }

  .steps {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin: 28px 0;
    text-align: left;
  }

  .steps h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text2);
    margin-bottom: 16px;
  }

  .step {
    display: flex;
    gap: 14px;
    margin-bottom: 14px;
    align-items: flex-start;
  }

  .step:last-child { margin-bottom: 0; }

  .step-num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #FF4D00, #FF8A00);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .step p {
    font-size: 0.95rem;
    margin-bottom: 0;
  }

  .btn {
    display: inline-block;
    padding: 14px 36px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
    margin-top: 8px;
  }

  .btn-fire {
    background: linear-gradient(135deg, #FF4D00, #FF8A00);
    color: white;
    box-shadow: 0 4px 20px rgba(255,77,0,0.35);
  }

  .btn-fire:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(255,77,0,0.5);
  }

  .btn-outline {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-outline:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .wa-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #25D366;
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    margin-top: 20px;
    transition: opacity 0.2s;
  }

  .wa-link:hover { opacity: 0.8; }

  .logo {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.1rem;
    font-weight: 800;
    background: linear-gradient(135deg, #FF4D00, #FF8A00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 40px;
    display: block;
  }

  /* Form styles */
  .form-section {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin: 28px 0;
    text-align: left;
  }

  .form-section h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text2);
    margin-bottom: 18px;
    text-align: center;
  }

  .form-group { margin-bottom: 14px; }

  .form-group label {
    display: block;
    font-size: 0.83rem;
    font-weight: 600;
    color: var(--text2);
    margin-bottom: 6px;
  }

  .form-input {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 1rem;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }

  .form-input:focus { border-color: var(--accent); }
  .form-input::placeholder { color: rgba(160,160,176,0.45); }

  .btn-submit {
    width: 100%;
    padding: 14px;
    margin-top: 6px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #FF4D00, #FF8A00);
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    box-shadow: 0 4px 20px rgba(255,77,0,0.35);
  }

  .btn-submit:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(255,77,0,0.5);
  }

  .btn-submit:disabled { opacity: 0.55; cursor: not-allowed; }

  .form-note {
    font-size: 0.8rem;
    color: var(--text2);
    text-align: center;
    margin-top: 10px;
    margin-bottom: 0;
  }

  .form-sent {
    background: rgba(0,200,83,0.1);
    border: 1px solid rgba(0,200,83,0.3);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    color: var(--green);
    font-weight: 600;
    font-size: 1.05rem;
  }
</style>
</head>

const params = new URLSearchParams(window.location.search);
const status = params.get('status') || 'unknown';
const btn = params.get('btn') || 'unknown';
const paymentId = params.get('collection_id') || params.get('payment_id') || '';

const content = document.getElementById('content');

async function enviarContacto(e) {
  e.preventDefault();
  const whatsapp = document.getElementById('input-whatsapp').value.replace(/[\s\-\(\)]/g, '');
  const email = document.getElementById('input-email').value.trim();
  if (!whatsapp && !email) {
    document.getElementById('input-whatsapp').focus();
    return;
  }
  const submitBtn = document.getElementById('btn-enviar');
  const originalText = submitBtn.textContent;
  submitBtn.disabled = true;
  submitBtn.textContent = 'Enviando...';
  try {
    await fetch('https://bot.boosfy.com/webhook/aiacademy-datos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        whatsapp,
        email,
        payment_id: document.getElementById('input-payment-id').value,
        status: document.getElementById('input-status').value
      })
    });
    document.getElementById('form-container').innerHTML = '<div class="form-sent">✅ ¡Perfecto! Te enviaremos tu acceso en breve.</div>';
  } catch(err) {
    submitBtn.disabled = false;
    submitBtn.textContent = originalText;
  }
}

  content.innerHTML = `
